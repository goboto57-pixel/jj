services:
  - type: web
    name: codeforge-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: codestral-latest
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://codeforge-client.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: codeforge-client
    runtime: static
    plan: starter
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://codeforge-server.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
